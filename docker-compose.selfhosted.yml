# GoDesk SMS self-hosted stack.
# Postgres and the API are reachable only on the compose network.
# Traefik publishes ports 80 and 443.

name: godesk-sms

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - godesk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./selfhosted
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.godesk.rule=Host(`${GODESK_HOST:?Set GODESK_HOST}`)
      - traefik.http.routers.godesk.entrypoints=web
      - traefik.http.routers.godesk.service=godesk
      - traefik.http.routers.godesk-secure.rule=Host(`${GODESK_HOST}`)
      - traefik.http.routers.godesk-secure.entrypoints=websecure
      - traefik.http.routers.godesk-secure.tls=true
      - traefik.http.routers.godesk-secure.service=godesk
      - traefik.http.services.godesk.loadbalancer.server.port=8080
      - traefik.http.services.godesk.loadbalancer.healthcheck.path=/health
      - traefik.http.services.godesk.loadbalancer.healthcheck.interval=10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  godesk_postgres:
